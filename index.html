<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; }
  body { display: flex; flex-direction: column; font: 13px/1 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #9a9aa0; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px 16px 8px; }
  canvas { background: #fff; border-radius: 14px; touch-action: none; cursor: crosshair; }
  #bar { display: flex; gap: 14px; align-items: center; justify-content: center; padding: 6px 16px 14px; flex-wrap: wrap; }
  button { font: inherit; color: #ddd; background: #1c1c20; border: 1px solid #333; border-radius: 7px; padding: 7px 12px; cursor: pointer; }
  button:hover { background: #26262b; }
  label { display: flex; gap: 8px; align-items: center; }
  input[type=range] { width: 120px; accent-color: #2f6fe4; }
  .hint { opacity: .7; }
  #seed { color: inherit; text-decoration: none; border-bottom: 1px dotted #555; }
  #tip { position: fixed; left: 0; top: 0; z-index: 5; display: none; width: 236px; box-sizing: border-box; padding: 9px 10px;
         background: #141417; border: 1px solid #333; border-radius: 8px; color: #c4c4ca; font-size: 11px; line-height: 1;
         box-shadow: 0 4px 14px rgba(0,0,0,.45); pointer-events: none; }
  #tip .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #tip .row:first-child { margin-top: 0; }
  #tip .name { flex: 0 0 108px; white-space: nowrap; }
  #tip .bar { position: relative; flex: 1; height: 5px; background: #26262b; border-radius: 3px; overflow: hidden; }
  #tip .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #e3122b; border-radius: 3px; }
  #tip .bar.mid::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #777; }
  #tip .val { flex: 0 0 auto; color: #ddd; }
  #tip .sep { height: 1px; background: #2c2c31; margin: 8px 0 2px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="tip"></div>
<div id="bar">
  <button id="pause">Pause</button>
  <button id="restart">Restart</button>
  <label>Speed <input id="speed" type="range" min="4" max="140" value="55"></label>
  <a id="seed" class="hint" title="Link to this exact run"></a>
  <span id="tally" class="hint"></span>
  <span class="hint">hold to steer · double-click to infect · hover to inspect · space pauses · R restarts</span>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  // Nothing here is scripted. Every infection is born with its own randomly
  // rolled traits, and every attack the creature makes is a freshly rolled
  // plan, so no two encounters are built from the same parts. The numbers in
  // this file are ranges and limits, not behaviours.

  // Creature colour is how much of its life a cell has left: fresh cells are
  // the first colour, and they run through the rest as they fade out.
  const FILL = ['#2f6fe4', '#5cd0e0', '#9d8df5', '#a9f2d4', '#18245e'];
  const INK  = ['#06163f', '#06404a', '#221463', '#0d4a35', '#b9c6ff'];
  const BANDS = [0.72, 0.52, 0.34, 0.17];   // life fractions where the colour changes

  const NUCLEUS = '#35208c';
  const STAIN = ['#6a5bd0', '#8e3f9e', '#b3245f'];   // a swallowed cell dissolving, last to first
  const BLACK = '#0a0a0a', RED = '#e3122b', BLOOD = '#7a0613', PINK = '#ff5a6e', SOUR = '#c214a8';
  const GLYPH_POOL = '0123456789#X%/\\<>=+*?!:;[]{}^~';

  const STEP = 0.65;       // cells the head moves per tick at an easy pace
  const MAX_TURN = 0.065;  // radians per tick when it isn't in a hurry
  const LOOK = 15;         // how far ahead the head looks, in cells
  const OWN_NECK = 40;     // newest path points the head doesn't count as an obstacle
  const TAIL = 105;        // ticks a cell under the very centre of the head survives
  const HIT_GAP = 25;      // ticks before the same infected cell can lose another layer
  const MAX_COLONIES = 6;
  const MAX_HEADS = 4;

  let cols, rows, px, dpr, area;
  let life, born, num, edge, vigor, tint, hurt;
  let germ, germHit, owner;
  let colonies, byId, nextId, infected, pressure, pressureGoal, pressureTimer;
  let arcs, stain, motes, scar, cleared, core;
  const born_ = [];   // spores that landed this tick
  let tickNo, heads, head, target = null;   // `head` is whichever head is acting right now
  let paused = false;

  // Every run grows from one seed, so a run you like can be opened again
  // from its link (as long as the window is the same size and you don't steer).
  let seed, rng;
  function random() {
    rng = (rng + 0x6d2b79f5) | 0;
    let t = Math.imul(rng ^ (rng >>> 15), 1 | rng);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  let asked = typeof location === 'undefined' ? NaN : parseInt(new URLSearchParams(location.search).get('seed'), 10);
  const seedLink = document.getElementById('seed');
  const tally = document.getElementById('tally');

  const rand = (a, b) => a + random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const skew = p => Math.pow(random(), p);   // p > 1 leans toward 0
  const angleDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

  // 1 + seven coin flips: 1..8, clustered around 4 and 5
  function rollNumber() {
    let n = 1;
    for (let i = 0; i < 7; i++) if (random() < 0.5) n++;
    return n;
  }

  // cheap repeatable noise, so a glitch holds still for a few ticks at a time
  function hash(a, b) {
    let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x7f4a7c15, 0xc2b2ae35);
    h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12;
    return h >>> 0;
  }

  function reset() {
    // the seed in the link is used once; after that each restart is a new run
    seed = Number.isFinite(asked) ? asked : Math.floor(Math.random() * 1e9);
    asked = NaN;
    rng = seed | 0;
    seedLink.textContent = 'run ' + seed;
    seedLink.href = '?seed=' + seed;
    const n = cols * rows;
    area = n;
    life = new Float32Array(n);    // creature: ticks left
    born = new Float32Array(n);    // creature: life it was last topped up to
    num = new Uint8Array(n);
    edge = new Float32Array(n);    // per-cell noise: ragged outline
    vigor = new Float32Array(n);   // per-cell noise: how long it lasts
    tint = new Float32Array(n);    // per-cell noise: when it changes colour
    hurt = new Int32Array(n);      // creature cells look corrupted until this tick
    for (let i = 0; i < n; i++) {
      edge[i] = rand(-0.9, 0.9);
      vigor[i] = rand(0.55, 1.45);
      tint[i] = rand(-0.13, 0.13);
    }
    germ = new Uint8Array(n);      // infection: armour layers left on the cell, 0 = none
    germHit = new Int32Array(n).fill(-1e9);   // tick the cell last lost a layer
    owner = new Int32Array(n);     // which colony the infected cell belongs to
    colonies = [];
    arcs = [];
    scar = new Int32Array(n);      // where infection was eaten stays faintly marked for a while
    motes = [];
    cleared = 0;
    core = new Uint8Array(n);      // cells showing a nucleus this frame                    // flecks thrown off when a colony dies
    stain = new Int32Array(n);     // creature cells that just swallowed something
    byId = new Map();
    nextId = 1;
    infected = 0;
    pressure = pressureGoal = 2;
    pressureTimer = 150;
    tickNo = 0;
    heads = [newHead(cols * rand(0.3, 0.7), rows * rand(0.3, 0.7), rand(0, Math.PI * 2))];
    head = heads[0];
  }

  function newHead(x, y, a) {
    return {
      x, y, a, v: STEP, path: [],
      k: 0, kGoal: 0, kTimer: 0,
      r: 6, rGoal: 6, rTimer: 0, R: 6,
      lobe: rand(0, Math.PI * 2),
      mode: 'idle', timer: 0, prey: null, plan: null,
      // inner state that drifts on its own and colours everything it does
      arousal: 0.6, arousalGoal: 0.6, restless: 0.5, restlessGoal: 0.5, moodTimer: 0,
      waypoint: null, wayPull: 0,
      fullness: 0,      // rises as it eats; makes it fat and lazy for a while
      anger: 0,         // rises when bites bounce off armour
      heat: 0,          // anger plus how much of the grid is infected
      memory: [],       // where it last fed
      stretch: 1, gaze: a,
      sick: 0,          // poison in its system: slows and shrinks it until it wears off
      vitality: 1,      // a split-off head withers once things calm down
    };
  }

  function layout() {
    const w = stage.clientWidth - 32, h = stage.clientHeight - 24;
    const px2 = Math.max(9, Math.min(13, Math.round(Math.min(w, h) / 78)));
    const cols2 = Math.max(12, Math.floor(w / px2)), rows2 = Math.max(12, Math.floor(h / px2));
    if (heads && px2 === px && cols2 === cols && rows2 === rows) return;   // same grid: keep the run
    px = px2; cols = cols2; rows = rows2;
    dpr = window.devicePixelRatio || 1;
    canvas.style.width = cols * px + 'px';
    canvas.style.height = rows * px + 'px';
    canvas.width = cols * px * dpr;
    canvas.height = rows * px * dpr;
    reset();
    draw();
  }

  // ---------------------------------------------------------------- infection

  // Every colony gets its own nature. The traits are independent sliders, so
  // "a runner" or "a fighter" is never chosen: a colony just happens to be
  // timid, or armoured, or spiteful, or hungry for space, in any mixture.
  const TRAITS = {            // [lowest, highest]
    greed:  [0, 1],           // how much of the grid it could ever cover
    growth: [0.4, 5],         // cells per tick
    armour: [0, 1],           // chance of extra layers on each cell
    spite:  [0, 1],           // how readily, and how often, it hits back
    nerve:  [0, 1],           // how readily it backs away
    tips:   [0, 1],           // 0 grows as a lump, 1 grows as tendrils
    lure:   [-1, 1],          // grows toward (+) or away from (-) the creature
    drive:  [0, 1],           // creeps in one direction
    spore:  [0, 1],           // how readily it throws off offspring
    hush:   [0, 1],           // how well it hides its scent
    venom:  [0, 1],           // how sick it makes whatever eats it
  };

  function rollTraits() {
    return {
      greed: skew(2.4), growth: 0.4 + 4.6 * skew(1.6), armour: skew(2.2),
      spite: skew(2.2), nerve: skew(2.4), tips: random(),
      lure: rand(-1, 1), drive: skew(2), spore: skew(3),
      hush: skew(2.4), venom: skew(2.4),
    };
  }

  // a child is its parent with every trait nudged
  function mutate(t) {
    const m = {};
    for (const k in TRAITS) {
      const [lo, hi] = TRAITS[k];
      m[k] = clamp(t[k] + rand(-0.12, 0.12) * (hi - lo), lo, hi);
    }
    return m;
  }

  function buildColony(t, budget) {
    const most = area * 0.55;
    if (budget === undefined) budget = 20 * Math.pow(most / 20, t.greed);
    const share = budget / most;
    const pool = GLYPH_POOL.split('');
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const c = {
      id: nextId++, traits: t, gen: 0, cells: [], held: new Set(), count: 0, age: 0, acc: 0, blocked: 0,
      budget, energy: budget,            // cells it can ever grow; it can't win, it runs dry
      growth: t.growth * (1 + 4 * share),
      armour: t.armour,
      spite: t.spite, fury: t.spite * 4,
      nerve: t.nerve, stamina: 1,        // it tires as it runs
      tips: t.tips, lure: t.lure,
      drive: t.drive, heading: rand(0, Math.PI * 2),
      spore: t.spore, hush: t.hush, venom: t.venom,
      noticed: false, near: Infinity, nearest: 0, cx: 0, cy: 0,
      x0: 0, x1: 0, y0: 0, y1: 0,
    };
    // its look follows from its nature, so you can read it before it acts
    c.look = {
      slot: Math.max(1, Math.round(10 - 8 * t.nerve + 8 * t.hush + rand(-1, 1))),   // jumpy ones flicker fast, quiet ones slowly
      red: clamp((0.3 + 0.5 * share + 0.3 * (c.growth / 8) + rand(-0.12, 0.12)) * (1 - 0.6 * t.hush), 0.1, 0.95),   // quiet ones stay dark
      sour: t.venom,                                                  // poisonous ones show magenta
      white: 0.1 + 0.7 * t.spite,                                       // spiteful ones spark white
      tears: (0.15 + 0.85 * t.spite) * (1 - t.hush),
      glyphs: pool.slice(0, 2 + Math.floor(rand(0, 8))).join(''),
    };
    return c;
  }

  // A colony with the urge throws a spore: a child lands some way off with a
  // share of the parent's remaining energy and a mutated copy of its nature.
  function throwSpore(c) {
    const a = rand(0, Math.PI * 2), d = rand(10, 30);
    const x = clamp(Math.round(c.cx + Math.cos(a) * d), 3, cols - 4);
    const y = clamp(Math.round(c.cy + Math.sin(a) * d), 3, rows - 4);
    if (germ[y * cols + x]) return null;
    const give = c.energy * rand(0.2, 0.5);
    c.energy -= give;
    const child = buildColony(mutate(c.traits), give);
    child.gen = c.gen + 1;
    child.look.glyphs = c.look.glyphs;   // family resemblance
    byId.set(child.id, child);
    addCell(child, x, y, 1);
    child.energy--;
    survey(child);
    arcs.push({ x0: c.cx, y0: c.cy, x1: x + 0.5, y1: y + 0.5, until: tickNo + 14 });
    return child;
  }

  function addCell(c, x, y, hp) {
    if (x < 0 || y < 0 || x >= cols || y >= rows) return -1;
    const i = y * cols + x;
    if (germ[i]) return -1;
    // a cell it held before is still in its list from last time
    if (!c.held.has(i)) { c.cells.push(i); c.held.add(i); }
    germ[i] = hp;
    germHit[i] = -1e9;
    owner[i] = c.id;
    c.count++;
    infected++;
    return i;
  }

  function removeCell(c, i) {
    germ[i] = 0;
    c.count--;
    infected--;
  }

  const alive = (c, i) => germ[i] > 0 && owner[i] === c.id;

  // a living cell of the colony; `tips` leans the pick toward its newest growth
  function pickCell(c, tips) {
    const n = c.cells.length;
    for (let t = 0; t < 4; t++) {
      const idx = random() < tips
        ? n - 1 - Math.floor(random() * Math.min(n, 6 + n * 0.1))
        : Math.floor(random() * n);
      const i = c.cells[idx];
      if (alive(c, i)) return i;
    }
    return -1;
  }

  // an empty cell next to the colony, or -1
  function pickFrontier(c, tips) {
    const from = pickCell(c, tips);
    if (from < 0) return -1;
    const d = Math.floor(random() * 4);
    const x = from % cols + [1, -1, 0, 0][d], y = Math.floor(from / cols) + [0, 0, 1, -1][d];
    if (x < 0 || y < 0 || x >= cols || y >= rows) return -1;
    const i = y * cols + x;
    return germ[i] ? -1 : i;
  }

  // One rule grows every colony: look at a few empty neighbours and take the
  // one this colony likes best. What it likes is down to its traits.
  function growOne(c) {
    let best = -1, bestScore = -Infinity;
    for (let k = 0; k < 3; k++) {
      const i = pickFrontier(c, c.tips);
      if (i < 0) continue;
      const x = i % cols + 0.5, y = Math.floor(i / cols) + 0.5;
      const toHead = Math.hypot(x - head.x, y - head.y);
      const along = Math.cos(c.heading) * (x - c.cx) + Math.sin(c.heading) * (y - c.cy);
      const score = -c.lure * toHead / 30 + c.drive * along / 10 + random();
      if (score > bestScore) { bestScore = score; best = i; }
    }
    if (best < 0) return;
    const hp = 1 + (random() < c.armour) + (random() < c.armour * c.armour);
    addCell(c, best % cols, Math.floor(best / cols), hp);
    c.energy--;
  }

  // Backing away is the same for any shape: give up the cells nearest the
  // creature and regrow them on the far side.
  function retreat(c) {
    const hunted = head.prey === c && head.mode !== 'idle';
    if (c.near > (hunted ? 34 : 12)) return;
    if (random() > c.nerve * c.stamina) return;
    const moves = Math.ceil(Math.sqrt(c.count) * 0.6);
    for (let m = 0; m < moves; m++) {
      let lose = -1, loseD = Infinity, gain = -1, gainD = -Infinity;
      for (let k = 0; k < 6; k++) {
        const i = pickCell(c, 0);
        if (i >= 0) {
          const d = Math.hypot(i % cols + 0.5 - head.x, Math.floor(i / cols) + 0.5 - head.y);
          if (d < loseD) { loseD = d; lose = i; }
        }
        const j = pickFrontier(c, 0);
        if (j >= 0) {
          const d = Math.hypot(j % cols + 0.5 - head.x, Math.floor(j / cols) + 0.5 - head.y);
          if (d > gainD) { gainD = d; gain = j; }
        }
      }
      if (lose < 0 || gain < 0 || gainD <= loseD) continue;
      const hp = germ[lose], hit = germHit[lose];
      removeCell(c, lose);
      germHit[addCell(c, gain % cols, Math.floor(gain / cols), hp)] = hit;
    }
    c.stamina *= 0.994;   // it runs out of breath
  }

  // The bite bounced off armour: the head is thrown back, part of its body
  // glitches, and the colony lashes a spike out at it. How hard depends on
  // how spiteful this colony is, and it can only do it so many times.
  function retaliate(c) {
    const h = head, s = c.spite;
    c.fury--;
    h.anger += 0.25;
    h.mode = 'recoil';
    h.timer = 12 + 20 * s;
    h.v = -STEP * (0.8 + 1.4 * s);

    const reach = Math.ceil(h.R) + 3;
    for (let y = Math.max(0, Math.floor(h.y) - reach); y <= Math.min(rows - 1, Math.floor(h.y) + reach); y++) {
      for (let x = Math.max(0, Math.floor(h.x) - reach); x <= Math.min(cols - 1, Math.floor(h.x) + reach); x++) {
        const i = y * cols + x;
        if (life[i] > 0 && random() < 0.15 + 0.4 * s) hurt[i] = tickNo + rand(15, 30 + 40 * s);
      }
    }

    const fx = c.nearest % cols, fy = Math.floor(c.nearest / cols);
    const a = Math.atan2(h.y - fy, h.x - fx);
    for (let n = 1; n <= 3 + 8 * s; n++) addCell(c, Math.round(fx + Math.cos(a) * n), Math.round(fy + Math.sin(a) * n), 1);
  }

  // where the colony is, and its closest cell to the head
  function survey(c) {
    let sx = 0, sy = 0, near = Infinity, nearest = 0;
    let x0 = cols, x1 = 0, y0 = rows, y1 = 0;
    for (const i of c.cells) {
      if (!alive(c, i)) continue;
      const x = i % cols, y = Math.floor(i / cols);
      sx += x; sy += y;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      const d = Math.hypot(x + 0.5 - head.x, y + 0.5 - head.y);
      if (d < near) { near = d; nearest = i; }
    }
    c.cx = sx / c.count + 0.5; c.cy = sy / c.count + 0.5;
    c.near = near; c.nearest = nearest;
    c.x0 = x0; c.x1 = x1; c.y0 = y0; c.y1 = y1;
  }

  // Outbreaks follow a pressure that rises and falls on its own, so they come
  // in flurries and lulls, and sometimes several are alive at once.
  function maybeSpawn() {
    if (--pressureTimer <= 0) {
      pressureGoal = 0.15 + 3.6 * skew(2.5);
      pressureTimer = rand(200, 700);
    }
    pressure += (pressureGoal - pressure) * 0.01;
    if (colonies.length >= MAX_COLONIES) return;
    const room = Math.max(0, 1 - 3 * infected / area);
    if (random() > 0.0022 * pressure * room) return;

    let x, y, tries = 0;
    do {
      x = Math.floor(rand(6, cols - 6));
      y = Math.floor(rand(6, rows - 6));
      head = nearestHead(x, y);
    } while ((germ[y * cols + x] || Math.hypot(x - head.x, y - head.y) < 25) && ++tries < 30);
    plant(x, y);
  }

  function plant(x, y) {
    if (x < 0 || y < 0 || x >= cols || y >= rows || germ[y * cols + x] || colonies.length >= MAX_COLONIES) return;
    const c = buildColony(rollTraits());
    colonies.push(c);
    byId.set(c.id, c);
    addCell(c, x, y, 1 + (random() < c.armour));
    c.energy--;
    head = nearestHead(x, y);
    survey(c);
  }

  function nearestHead(x, y) {
    let best = heads[0], bestD = Infinity;
    for (const h of heads) {
      const d = Math.hypot(h.x - x, h.y - y);
      if (d < bestD) { bestD = d; best = h; }
    }
    return best;
  }

  function updateColonies() {
    maybeSpawn();
    for (const c of colonies) {
      if (c.count <= 0) continue;
      c.age++;
      if (c.cells.length > c.count * 1.5 + 24) {
        c.cells = c.cells.filter(i => alive(c, i));
        c.held = new Set(c.cells);
      }
      head = nearestHead(c.cx, c.cy);   // a colony reacts to whichever head is closest
      survey(c);
      if (c.energy > 0) {
        c.acc += c.growth;
        while (c.acc >= 1 && c.energy > 0) { c.acc--; growOne(c); }
      }
      if (c.count > 1) retreat(c);
      if (c.count > 12 && c.energy > 30 && colonies.length + born_.length < MAX_COLONIES
          && random() < 0.01 * c.spore) {
        const child = throwSpore(c);
        if (child) born_.push(child);
      }
    }
    colonies.push(...born_);
    born_.length = 0;
    for (const c of colonies) {
      if (c.count > 0) continue;
      cleared++;
      // the bigger it got, the more it scatters when it goes
      for (let n = 4 + Math.sqrt(c.budget - c.energy); n > 0; n--) {
        const a = rand(0, Math.PI * 2), v = rand(0.15, 0.9);
        motes.push({ x: c.cx, y: c.cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, until: tickNo + rand(10, 32) });
      }
      for (const h of heads) {
        h.memory.push({ x: c.cx, y: c.cy });
        if (h.memory.length > 5) h.memory.shift();
      }
      byId.delete(c.id);
    }
    colonies = colonies.filter(c => c.count > 0);
  }

  // ----------------------------------------------------------------- creature

  function turnToward(angle, rate) {
    head.a += clamp(angleDiff(angle, head.a), -rate, rate);
  }

  // Free space around a point: distance to the nearest wall or to the
  // trail (ignoring the stretch right behind the head).
  function clearance(x, y) {
    let c = Math.min(x, y, cols - x, rows - y) - head.r;
    const path = head.path;
    for (let i = path.length - 1 - OWN_NECK; i >= 0; i -= 2) {
      const d = Math.hypot(path[i].x - x, path[i].y - y) - head.r - 1;
      if (d < c) c = d;
    }
    return c;
  }

  function probe(offset) {
    const a = head.a + offset;
    const cx = Math.cos(a), cy = Math.sin(a);
    return Math.min(
      clearance(head.x + cx * LOOK, head.y + cy * LOOK),
      clearance(head.x + cx * LOOK / 2, head.y + cy * LOOK / 2));
  }

  // steer clear of walls and its own trail; returns false if the way is open
  function avoid() {
    const h = head;
    const ahead = probe(0), left = probe(-0.8), right = probe(0.8);
    if (ahead >= 3 && Math.min(left, right) >= 1) return false;
    h.a += left > right ? -MAX_TURN : MAX_TURN;
    h.k = 0;
    h.kTimer = 0;
    return true;
  }

  function meander(scale) {
    const h = head;
    if (--h.kTimer <= 0) {
      h.kGoal = (random() < 0.2 ? rand(-MAX_TURN, MAX_TURN) : rand(-0.03, 0.03)) * scale;
      h.kTimer = rand(30, 110);
    }
    h.k += (h.kGoal - h.k) * 0.06;
    h.a += h.k;
  }

  // With nothing to hunt it is never just "wandering". Its arousal and
  // restlessness drift, and it keeps picking somewhere it feels like going,
  // so it rests, breathes, dawdles, patrols the edges, twitches, or goes
  // back to nose around where it last fed, in whatever mix the moment gives.
  function idle() {
    const h = head;
    if (--h.moodTimer <= 0) {
      h.moodTimer = rand(80, 300);
      h.arousalGoal = clamp(rand(-0.2, 1.1) - 0.5 * h.fullness, 0, 1);
      h.restlessGoal = random();
      h.wayPull = rand(0.3, 1);
      const pick = random();
      if (pick < 0.35) {
        h.waypoint = null;
      } else if (pick < 0.6 && h.memory.length) {
        const m = h.memory[Math.floor(random() * h.memory.length)];
        h.waypoint = { x: m.x, y: m.y };
      } else {
        // anywhere, with a lean toward the edges
        const hug = random() < 0.4;
        h.waypoint = {
          x: hug && random() < 0.5 ? (random() < 0.5 ? 9 : cols - 9) : rand(9, cols - 9),
          y: hug ? (random() < 0.5 ? 9 : rows - 9) : rand(9, rows - 9),
        };
      }
    }
    h.arousal += (h.arousalGoal - h.arousal) * 0.02;
    h.restless += (h.restlessGoal - h.restless) * 0.02;

    if (!avoid()) {
      if (h.waypoint) {
        const d = Math.hypot(h.waypoint.x - h.x, h.waypoint.y - h.y);
        if (d < 6) {
          // got there: nose about for a bit
          h.waypoint = null;
          h.arousalGoal *= 0.4;
          h.restlessGoal = 1;
        } else {
          turnToward(Math.atan2(h.waypoint.y - h.y, h.waypoint.x - h.x), MAX_TURN * h.wayPull);
        }
      }
      meander(0.4 + 1.6 * h.restless);
    }

    // a sudden start
    if (random() < 0.004 * (0.3 + h.restless)) {
      h.a += rand(-1.2, 1.2);
      h.r *= rand(0.7, 1.3);
      h.v = STEP * rand(1, 2);
    }

    if (h.arousal < 0.25) {
      // resting: slow breathing
      h.rGoal = 6 + 3 * h.fullness + 1.6 * Math.sin(tickNo * 0.05);
    } else if (--h.rTimer <= 0) {
      h.rGoal = rand(3.5, 10) + 3 * h.fullness;
      h.rTimer = rand(14, 45);
    }
    return STEP * (0.08 + 1.15 * h.arousal);
  }

  // Every approach is a new plan made of independent choices. A lunge from
  // ambush, a string of quick bites, a tightening spiral or a slow engulfing
  // are just regions of this space, with everything in between.
  function makePlan(c) {
    const h = head, hot = Math.min(1, h.heat);
    const roll = {
      orbit: skew(1.8),          // 0 comes straight in, 1 circles
      weave: rand(0, 0.9),
      pace: rand(0.3, 1.3),      // approach speed
      strikeDist: rand(3, 22),   // how close before it commits
      windup: rand(6, 34),       // how long it coils
      punch: rand(0.5, 1.4),     // how hard it strikes for that distance
      wide: rand(0.5, 1.1),      // how wide it opens for that size of prey
      over: rand(4, 14),         // how far past it carries
      rest: rand(10, 55),
    };
    return {
      orbit: roll.orbit,
      // two heads on the same prey come round it from opposite sides
      side: (heads.find(o => o !== h && o.prey === c && o.plan) || { plan: { side: random() < 0.5 ? -1 : 1 } }).plan.side * -1,
      weave: roll.weave, weaveRate: rand(0.03, 0.1), phase: rand(0, 6.3),
      pace: roll.pace * (1 + hot),
      strikeDist: roll.strikeDist,
      windup: roll.windup / (1 + 2 * hot),
      tense: rand(2.5, 4.5),                    // how small it draws itself
      burst: clamp(roll.strikeDist / 7 * roll.punch, 0.08, 3.3) * (1 + 0.5 * hot),
      gape: clamp(Math.sqrt(c.count) * roll.wide + rand(2, 5), 4, 13),
      over: roll.over,
      rest: roll.rest / (1 + 2 * hot),
      patience: rand(80, 260),
    };
  }

  function choosePrey(known) {
    let best = null, bestScore = -Infinity;
    for (const c of known) {
      // heads spread out rather than all chasing the same thing
      const taken = heads.filter(h => h !== head && h.prey === c).length;
      const score = -c.near * rand(0.5, 1.5) + Math.sqrt(c.count) * rand(0, 3) - 15 * taken;
      if (score > bestScore) { bestScore = score; best = c; }
    }
    return best;
  }

  function engage(known, startled) {
    const h = head;
    h.prey = choosePrey(known);
    h.plan = makePlan(h.prey);
    if (startled) {
      h.mode = 'alert';
      h.timer = rand(25, 45) * (1 - 0.7 * Math.min(1, h.heat));
    } else {
      h.mode = 'approach';
      h.timer = h.plan.patience;
    }
  }

  function moveHead() {
    const h = head;

    h.anger *= 0.997;
    h.fullness *= 0.9985;
    h.heat = clamp(4 * infected / area + h.anger, 0, 1.5);
    const hot = Math.min(1, h.heat);

    // a colony's scent spreads the longer it's been there and the bigger it is
    for (const c of colonies) {
      if (c.count > 0) survey(c);   // distances as this head sees them
      const scent = (18 + c.age * 0.15 + Math.sqrt(c.count)) * (1 - 0.75 * c.hush);
      if (!c.noticed && c.near < scent) c.noticed = true;
    }
    const known = colonies.filter(c => c.noticed && c.count > 0);
    if (h.prey && h.prey.count <= 0) h.prey = null;

    if (!h.prey && (h.mode === 'alert' || h.mode === 'approach' || h.mode === 'windup')) {
      if (known.length) engage(known, false);
      else { h.mode = 'digest'; h.timer = rand(45, 70); }
    }

    // aim a little way inside the nearest edge of the prey
    let dist = 0, bearing = h.a;
    if (h.prey) {
      const c = h.prey;
      const nx = c.nearest % cols + 0.5, ny = Math.floor(c.nearest / cols) + 0.5;
      const t = Math.min(1, 6 / (Math.hypot(c.cx - nx, c.cy - ny) || 1));
      const ax = nx + (c.cx - nx) * t, ay = ny + (c.cy - ny) * t;
      dist = Math.hypot(ax - h.x, ay - h.y);
      bearing = Math.atan2(ay - h.y, ax - h.x);
    }

    // its nucleus leans toward whatever has its attention
    h.gaze += angleDiff(h.prey ? bearing : h.a, h.gaze) * 0.15;

    const p = h.plan;
    let speed = STEP, swell = 0.09;

    if (target && h === heads[0]) {
      h.mode = 'idle';
      h.prey = null;
      turnToward(Math.atan2(target.y - h.y, target.x - h.x), MAX_TURN);
    } else if (h.mode === 'idle') {
      if (known.length) engage(known, true);
      else speed = idle();
    } else if (h.mode === 'alert') {
      // stops and turns to look
      turnToward(bearing, 0.05);
      speed = STEP * 0.12;
      h.rGoal = 4.5;
      if (--h.timer <= 0) { h.mode = 'approach'; h.timer = p.patience; }
    } else if (h.mode === 'approach') {
      const swing = p.side * p.orbit * 1.45 * clamp(dist / (p.strikeDist + 4), 0.3, 1);
      turnToward(bearing + swing + p.weave * Math.sin(tickNo * p.weaveRate + p.phase), 0.08 + 0.12 * p.orbit);
      speed = STEP * p.pace * (1 + p.orbit);   // going round takes longer, so it goes quicker
      h.rGoal = p.tense + 1 + 0.6 * Math.sin(tickNo * 0.15);
      if (dist < p.strikeDist || --h.timer <= 0) { h.mode = 'windup'; h.timer = p.windup; }
    } else if (h.mode === 'windup') {
      // draws itself in and shivers
      turnToward(bearing, 0.2);
      speed = STEP * 0.05;
      h.rGoal = p.tense * 0.8;
      h.lobe += 0.25;
      if (--h.timer <= 0) {
        h.mode = 'strike';
        const travel = (dist + p.over) / (STEP * p.burst);
        // a slow strike is really settling on top of it, so it gets time to feed
        h.timer = Math.min(170, travel) + (p.burst < 0.7 ? rand(60, 120) : 0);
      }
    } else if (h.mode === 'strike') {
      if (h.prey) turnToward(bearing, 0.1 / (1 + 1.5 * p.burst));
      speed = STEP * p.burst;
      if (p.burst < 0.7 && dist < 3) speed = STEP * 0.04;
      h.rGoal = p.gape;
      swell = 0.045 + 0.1 * p.burst;
      if (--h.timer <= 0 || (!h.prey && p.burst < 0.7)) {
        if (known.length) { h.mode = 'recover'; h.timer = p.rest; }
        else { h.mode = 'digest'; h.timer = rand(45, 70); }
      }
    } else if (h.mode === 'recoil') {
      // thrown back off armour: flinch small, then come round again
      speed = -STEP * 0.4;
      h.rGoal = 3;
      swell = 0.3;
      h.lobe += 0.3;
      if (--h.timer <= 0) { h.mode = 'recover'; h.timer = rand(8, 25) / (1 + 2 * hot); }
    } else if (h.mode === 'digest') {
      // sits and throbs
      if (known.length) engage(known, true);
      speed = STEP * 0.08;
      h.rGoal = 7 + 3 * h.fullness + 2.5 * Math.sin(h.timer * 0.35);
      swell = 0.2;
      h.lobe += 0.08;
      if (--h.timer <= 0 && h.mode === 'digest') { h.mode = 'idle'; h.moodTimer = 0; }
    } else {
      // recover: carries on past, loose, before deciding what next
      if (!avoid()) meander(1);
      speed = STEP * 0.5 * (1 + hot);
      if (--h.rTimer <= 0) { h.rGoal = rand(3.5, 10); h.rTimer = rand(14, 45); }
      if (--h.timer <= 0) {
        if (known.length) engage(known, false);
        else { h.mode = 'idle'; h.moodTimer = 0; }
      }
    }

    h.sick *= 0.996;
    speed *= 1 - 0.4 * h.sick;
    h.v += (speed - h.v) * (h.mode === 'strike' ? 0.4 : 0.12);
    h.r += (h.rGoal - h.r) * swell;
    // the more infection there is, the bigger it gets; a withering head shrinks away
    h.R = h.r * (1 + 0.6 * hot) * Math.min(1, h.vitality * 3) * (1 - 0.3 * h.sick);
    h.lobe += 0.05;

    h.x = clamp(h.x + Math.cos(h.a) * h.v, 1, cols - 1);
    h.y = clamp(h.y + Math.sin(h.a) * h.v, 1, rows - 1);
    h.path.push({ x: h.x, y: h.y });
    if (h.path.length > TAIL) h.path.shift();
  }

  // The head is a lumpy disc. A cell under its centre gets a full life;
  // cells toward the rim get much less, so the trail thins out fast.
  // Infected cells under it lose a layer of armour, or are eaten.
  function stampHead() {
    const h = head;
    const gap = HIT_GAP * (1 - 0.7 * Math.min(1, h.heat));
    // it stretches out along its heading when it moves fast and sits squat when still
    h.stretch += (clamp(1 + 0.3 * (Math.abs(h.v) / STEP - 1), 0.85, 1.9) - h.stretch) * 0.2;
    const long = h.stretch, wide = 1 / Math.sqrt(long);
    const ca = Math.cos(h.a), sa = Math.sin(h.a);
    const w2 = 0.05 + 0.1 * h.restless, w5 = 0.03 + 0.06 * h.arousal;
    const reach = h.R * 1.4 * long + 1;
    const x0 = Math.max(0, Math.floor(h.x - reach)), x1 = Math.min(cols - 1, Math.floor(h.x + reach));
    const y0 = Math.max(0, Math.floor(h.y - reach)), y1 = Math.min(rows - 1, Math.floor(h.y + reach));
    let ate = 0;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * cols + x;
        const dx = x + 0.5 - h.x, dy = y + 0.5 - h.y;
        // the outline is a few slow waves of different counts running round the rim
        const th = Math.atan2(dy, dx);
        const rim = h.R * (1 + 0.16 * Math.sin(3 * th + h.lobe) + w2 * Math.sin(2 * th - 0.6 * h.lobe) + w5 * Math.sin(5 * th + 1.7 * h.lobe));
        const along = (dx * ca + dy * sa) / long, across = (dy * ca - dx * sa) / wide;
        const u = (Math.hypot(along, across) - edge[i]) / rim;
        if (u >= 1) continue;
        if (germ[i] && u < 0.85 && tickNo - germHit[i] > gap) {
          // one layer per pass: armoured cells take several attacks
          germHit[i] = tickNo;
          const c = byId.get(owner[i]);
          if (germ[i] === 1) {
            removeCell(c, i); ate++;
            stain[i] = tickNo + rand(8, 30);
            scar[i] = tickNo + rand(150, 450);
            if (random() < c.venom) {
              // poison: the mouthful shows as corruption, and it adds up
              hurt[i] = tickNo + rand(20, 60);
              h.sick = Math.min(1, h.sick + 0.008);
            }
          }
          else { germ[i]--; c.blocked++; }
        }
        const inward = 1 - Math.max(u, 0);
        const v = TAIL * inward * inward * vigor[i] + 5;
        if (v > life[i]) {
          if (life[i] <= 0) num[i] = rollNumber();
          life[i] = born[i] = v;
        }
      }
    }
    if (ate) {
      // swallowing makes the head swell, and fills it up
      h.r = Math.min(14, h.r + 0.05 * ate);
      h.fullness = Math.min(1, h.fullness + 0.004 * ate);
    }
    for (const c of colonies) {
      if (c.blocked >= 3 && c.count > 0 && c.fury >= 1 && h.mode !== 'recoil' && random() < 0.35 + 0.65 * c.spite) {
        retaliate(c);
      }
      h.anger = Math.min(1, h.anger + 0.002 * c.blocked);
      c.blocked = 0;
    }
  }

  // The immune response. Under enough pressure a head pinches in two, and
  // the pair hunt separately. Once things calm down the extra ones wither.
  function divide(h) {
    const child = newHead(h.x, h.y, h.a - 1);
    h.a += 1;
    h.r *= 0.72;
    child.r = h.r;
    child.rGoal = h.rGoal;
    h.v = child.v = STEP * 2.2;      // they spring apart
    child.mode = 'recover';
    child.timer = 15;
    child.anger = h.anger;
    child.heat = h.heat;
    child.memory = [...h.memory];
    return child;
  }

  function manageHeads() {
    const split = [];
    for (const h of heads) {
      if (heads.length + split.length < MAX_HEADS && h.r > 4 && h.vitality > 0.5
          && random() < 0.002 * Math.max(0, h.heat - 0.65)) {
        split.push(divide(h));
      }
      if (h !== heads[0]) h.vitality = clamp(h.vitality + 0.01 * (h.heat - 0.2), 0, 1);
    }
    heads.push(...split);
    const first = heads[0];
    heads = heads.filter(h => h === first || h.vitality > 0);
  }

  function tick() {
    tickNo++;
    for (let i = 0; i < life.length; i++) if (life[i] > 0) life[i]--;
    for (const h of heads) {
      head = h;
      moveHead();
      stampHead();
    }
    manageHeads();
    updateColonies();
    head = heads[0];
    motes = motes.filter(m => m.until > tickNo);
    for (const m of motes) { m.x += m.vx; m.y += m.vy; m.vx *= 0.93; m.vy *= 0.93; }
  }

  // ------------------------------------------------------------------ drawing

  function band(i) {
    const f = life[i] / born[i] + tint[i];
    let b = 0;
    while (b < BANDS.length && f < BANDS[b]) b++;
    return b;
  }

  // exposed cells are red and black in the colony's own mix; armoured ones
  // go almost solid black
  function germFill(c, i, r) {
    const hp = germ[i];
    const dark = 1 - c.look.red * (hp === 1 ? 1 : hp === 2 ? 0.35 : 0.08);
    const f = (r % 1000) / 1000;
    if (f < dark) return BLACK;
    if (f > 1 - (1 - dark) * 0.2) return BLOOD;
    return (r >>> 22) % 100 < 100 * c.look.sour ? SOUR : RED;
  }

  function drawColonies() {
    for (const c of colonies) {
      const slot = Math.floor(tickNo / c.look.slot);
      for (const i of c.cells) {
        if (!alive(c, i)) continue;
        ctx.fillStyle = germFill(c, i, hash(i, slot));
        ctx.fillRect((i % cols) * px, Math.floor(i / cols) * px, px, px);
      }
      // torn scanlines sticking out of the sides
      const tears = Math.ceil(c.look.tears * (1 + Math.sqrt(c.count) / 4));
      for (let g = 0; g < tears; g++) {
        const r = hash(g + c.id * 31, slot);
        if (r % 5 < 2) continue;
        const y = c.y0 + (r >>> 3) % (c.y1 - c.y0 + 1);
        const len = 2 + (r >>> 9) % 4;
        const x = (r >>> 13) % 2 ? c.x1 + 1 - (r >>> 15) % 2 : c.x0 - len + (r >>> 15) % 2;
        ctx.fillStyle = (r >>> 17) % 3 ? RED : BLACK;
        ctx.fillRect(x * px, y * px + px * 0.2, len * px, px * 0.6);
      }
    }
  }

  function drawColonyGlyphs() {
    for (const c of colonies) {
      const slot = Math.floor(tickNo / c.look.slot);
      const g = c.look.glyphs;
      for (const i of c.cells) {
        if (!alive(c, i)) continue;
        const r = hash(i, slot);
        const onBlack = germFill(c, i, r) === BLACK;
        const spark = ((r >>> 10) % 100) / 100 < c.look.white;
        ctx.fillStyle = onBlack ? (spark ? '#fff' : RED) : (spark ? PINK : BLACK);
        ctx.fillText(g[(r >>> 18) % g.length], (i % cols) * px + px / 2 + 0.5, Math.floor(i / cols) * px + px / 2 + 1);
      }
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cols * px, rows * px);

    // Each head carries a dark nucleus, pushed toward what it is watching:
    // you can see it notice something before it moves. It tightens when
    // the head coils to strike.
    core.fill(0);
    for (const h of heads) {
      const tight = h.mode === 'windup' ? 0.2 : h.mode === 'alert' ? 0.36 : 0.28;
      const nr = Math.max(1.1, h.R * tight);
      const nx = h.x + Math.cos(h.gaze) * h.R * 0.38, ny = h.y + Math.sin(h.gaze) * h.R * 0.38;
      for (let y = Math.max(0, Math.floor(ny - nr - 1)); y <= Math.min(rows - 1, Math.floor(ny + nr + 1)); y++) {
        for (let x = Math.max(0, Math.floor(nx - nr - 1)); x <= Math.min(cols - 1, Math.floor(nx + nr + 1)); x++) {
          const i = y * cols + x;
          if (Math.hypot(x + 0.5 - nx, y + 0.5 - ny) < nr + 0.4 * edge[i]) core[i] = 1;
        }
      }
    }

    const slot = tickNo >> 2;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        if (scar[i] > tickNo && life[i] <= 0 && !germ[i]) {
          ctx.globalAlpha = 0.3 * Math.min(1, (scar[i] - tickNo) / 150);
          ctx.fillStyle = '#f3b9c6';
          ctx.fillRect(x * px, y * px, px, px);
          ctx.globalAlpha = 1;
        }
        if (life[i] <= 0 || germ[i]) continue;
        ctx.fillStyle = hurt[i] > tickNo ? (hash(i, slot) % 5 < 3 ? BLACK : RED)
          : stain[i] > tickNo ? STAIN[Math.min(2, (stain[i] - tickNo) >> 3)]
          : core[i] ? NUCLEUS
          : FILL[band(i)];
        ctx.fillRect(x * px, y * px, px, px);
      }
    }

    drawColonies();

    // spores in flight
    arcs = arcs.filter(a => a.until > tickNo);
    ctx.fillStyle = RED;
    for (const a of arcs) {
      const t = 1 - (a.until - tickNo) / 14;
      for (let k = 0; k < 3; k++) {
        const u = clamp(t - k * 0.08, 0, 1);
        const x = a.x0 + (a.x1 - a.x0) * u, y = a.y0 + (a.y1 - a.y0) * u - Math.sin(u * Math.PI) * 4;
        ctx.fillRect(Math.floor(x) * px + px * 0.25, Math.floor(y) * px + px * 0.25, px * 0.5, px * 0.5);
      }
    }

    for (const m of motes) {
      const left = (m.until - tickNo) / 32;
      ctx.fillStyle = hash(Math.floor(m.x) * 7919 + Math.floor(m.y), tickNo >> 1) % 3 ? RED : BLACK;
      const size = px * (0.3 + 0.6 * left);
      ctx.fillRect(Math.floor(m.x) * px + (px - size) / 2, Math.floor(m.y) * px + (px - size) / 2, size, size);
    }

    ctx.strokeStyle = '#1b2440';
    ctx.lineWidth = 0.5;
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    for (let x = 1; x < cols; x++) { ctx.moveTo(x * px + 0.5, 0); ctx.lineTo(x * px + 0.5, rows * px); }
    for (let y = 1; y < rows; y++) { ctx.moveTo(0, y * px + 0.5); ctx.lineTo(cols * px, y * px + 0.5); }
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.font = `600 ${Math.round(px * 0.72)}px "Lato", "Helvetica Neue", Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        if (life[i] <= 0 || germ[i]) continue;
        ctx.fillStyle = hurt[i] > tickNo ? (hash(i, slot) % 5 < 3 ? RED : BLACK) : core[i] && stain[i] <= tickNo ? '#d9d0ff' : INK[band(i)];
        ctx.fillText(num[i], x * px + px / 2 + 0.5, y * px + px / 2 + 1);
      }
    }
    drawColonyGlyphs();

    tally.textContent = `cleared ${cleared} · alive ${colonies.length}` + (heads.length > 1 ? ` · split in ${heads.length}` : '');
  }

  // ----------------------------------------------------------------- controls

  const speed = document.getElementById('speed');
  let prev = performance.now(), owed = 0;
  function frame(now) {
    const dt = Math.min(0.25, (now - prev) / 1000);
    prev = now;
    if (!paused) {
      owed += dt * speed.value;
      let ran = false;
      while (owed >= 1) { tick(); owed--; ran = true; }
      if (ran) draw();
    }
    requestAnimationFrame(frame);
  }

  const pauseBtn = document.getElementById('pause');
  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Play' : 'Pause';
  }
  function restart() { reset(); draw(); }

  pauseBtn.onclick = togglePause;
  document.getElementById('restart').onclick = restart;
  addEventListener('keydown', e => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;   // leave browser shortcuts alone
    if (e.code === 'Space') {
      e.preventDefault();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // or a focused button fires too
      togglePause();
    }
    if (e.key === 'r' || e.key === 'R') restart();
  });

  function pointAt(e) {
    const b = canvas.getBoundingClientRect();
    target = { x: (e.clientX - b.left) / px, y: (e.clientY - b.top) / px };
  }
  canvas.addEventListener('pointerdown', e => { if (e.button !== 0) return; canvas.setPointerCapture(e.pointerId); pointAt(e); });
  canvas.addEventListener('pointermove', e => { if (target) pointAt(e); });
  canvas.addEventListener('pointerup', () => { target = null; });
  canvas.addEventListener('pointercancel', () => { target = null; });
  addEventListener('blur', () => { target = null; });
  // double-click drops a new infection where you clicked
  canvas.addEventListener('dblclick', e => {
    const b = canvas.getBoundingClientRect();
    plant(Math.floor((e.clientX - b.left) / px), Math.floor((e.clientY - b.top) / px));
    head = heads[0];
    draw();
  });

  // ------------------------------------------------------------ hover inspector
  // Hover an infected cell (mouse up) to read that colony's nature. One line
  // per trait; to show another trait later, add one line to SHOWN.
  const SHOWN = [               // [trait, plain-English label]
    ['greed',  'spreads'],
    ['growth', 'grows fast'],
    ['armour', 'armour'],
    ['spite',  'hits back'],
    ['nerve',  'runs away'],
    ['tips',   'tendrils'],
    ['lure',   'seeks / avoids you'],
    ['drive',  'drifts one way'],
    ['spore',  'spores'],
    ['hush',   'hides'],
    ['venom',  'poisonous'],
  ];
  const tip = document.getElementById('tip');
  let hover = null;             // last mouse position over the canvas, or null

  function tipRow(name, frac, text, mid) {
    return '<div class="row"><span class="name">' + name + '</span>' +
      (frac === null ? '<span class="bar" style="visibility:hidden"></span>' :
        '<span class="bar' + (mid ? ' mid' : '') + '"><i style="width:' + (100 * clamp(frac, 0, 1)).toFixed(0) + '%"></i></span>') +
      (text === '' ? '' : '<span class="val">' + text + '</span>') + '</div>';
  }

  function colonyAt(clientX, clientY) {
    const b = canvas.getBoundingClientRect();
    const x = Math.floor((clientX - b.left) / px), y = Math.floor((clientY - b.top) / px);
    if (x < 0 || y < 0 || x >= cols || y >= rows) return null;
    const i = y * cols + x;
    return germ[i] > 0 ? byId.get(owner[i]) || null : null;
  }

  function showTip() {
    const c = hover && !target ? colonyAt(hover.x, hover.y) : null;
    if (!c) { tip.style.display = 'none'; return; }
    let html = '';
    for (const [key, name] of SHOWN) {
      if (!TRAITS[key] || typeof c.traits[key] !== 'number') continue;   // unknown trait: skip
      const [lo, hi] = TRAITS[key];
      html += tipRow(name, (c.traits[key] - lo) / (hi - lo), '', lo < 0);
    }
    html += '<div class="sep"></div>';
    html += tipRow('cells', null, c.count, false);
    html += tipRow('generation', null, c.gen, false);
    html += tipRow('energy left', c.energy / c.budget, Math.round(100 * clamp(c.energy / c.budget, 0, 1)) + '%', false);
    html += tipRow('hits left', null, Math.max(0, Math.floor(c.fury)), false);
    tip.innerHTML = html;
    tip.style.display = 'block';
    // sit beside the cursor, flipped or nudged so it stays inside the window
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let left = hover.x + 16, top = hover.y + 16;
    if (left + w > window.innerWidth - 8) left = hover.x - 16 - w;
    if (top + h > window.innerHeight - 8) top = hover.y - 16 - h;
    tip.style.left = Math.max(8, left) + 'px';
    tip.style.top = Math.max(8, top) + 'px';
  }

  canvas.addEventListener('pointermove', e => { hover = { x: e.clientX, y: e.clientY }; showTip(); });
  canvas.addEventListener('pointerleave', () => { hover = null; showTip(); });
  canvas.addEventListener('pointerdown', () => showTip());   // steering hides it
  // the colony changes every tick (and the sim may be paused), so refresh on its own loop
  (function tipLoop() { if (hover) showTip(); requestAnimationFrame(tipLoop); })();

  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });

  // for poking at it from the browser console
  window.snake = {
    get head() { return heads[0]; },
    get heads() { return heads; },
    get cleared() { return cleared; },
    get colonies() { return colonies; },
    get infected() { return infected / area; },
    tick, draw, restart,
  };

  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
