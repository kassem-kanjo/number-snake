<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; }
  body { display: flex; flex-direction: column; font: 13px/1 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #9a9aa0; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px 16px 8px; }
  canvas { background: #fff; border-radius: 14px; touch-action: none; cursor: crosshair; }
  #bar { display: flex; gap: 14px; align-items: center; justify-content: center; padding: 6px 16px 14px; flex-wrap: wrap; }
  button { font: inherit; color: #ddd; background: #1c1c20; border: 1px solid #333; border-radius: 7px; padding: 7px 12px; cursor: pointer; }
  button:hover { background: #26262b; }
  label { display: flex; gap: 8px; align-items: center; }
  input[type=range] { width: 120px; accent-color: #2f6fe4; }
  .hint { opacity: .7; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar">
  <button id="pause">Pause</button>
  <button id="restart">Restart</button>
  <label>Speed <input id="speed" type="range" min="4" max="140" value="55"></label>
  <span class="hint">Hold the mouse down on the grid to steer · space = pause · R = restart</span>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  // Colour is how much of its life a cell has left: fresh cells are the
  // first colour, and they run through the rest as they fade out.
  const FILL = ['#2f6fe4', '#5cd0e0', '#9d8df5', '#a9f2d4', '#18245e'];
  const INK  = ['#06163f', '#06404a', '#221463', '#0d4a35', '#b9c6ff'];
  const BANDS = [0.72, 0.52, 0.34, 0.17];   // life fractions where the colour changes

  const STEP = 0.65;       // cells the head moves per tick
  const MAX_TURN = 0.065;  // radians per tick
  const LOOK = 15;         // how far ahead the head looks, in cells
  const OWN_NECK = 40;     // newest path points the head doesn't count as an obstacle
  const TAIL = 105;
  const HIT_GAP = 25;      // ticks before the same infected cell can lose another layer        // ticks a cell under the very centre of the head survives

  let cols, rows, px, dpr;
  let life, born, num, edge, vigor, tint;
  let germ, germHit, germCells, germToGrow, germWait, germAge, kind, hurt;
  let path, tickNo, head, target = null;
  let paused = false;

  const rand = (a, b) => a + Math.random() * (b - a);

  // 1 + seven coin flips: 1..8, clustered around 4 and 5
  function rollNumber() {
    let n = 1;
    for (let i = 0; i < 7; i++) if (Math.random() < 0.5) n++;
    return n;
  }

  function reset() {
    const n = cols * rows;
    life = new Float32Array(n);    // ticks left
    born = new Float32Array(n);    // life it was last topped up to
    num = new Uint8Array(n);
    edge = new Float32Array(n);    // per-cell noise: ragged outline
    vigor = new Float32Array(n);   // per-cell noise: how long it lasts
    tint = new Float32Array(n);    // per-cell noise: when it changes colour
    for (let i = 0; i < n; i++) {
      edge[i] = rand(-0.9, 0.9);
      vigor[i] = rand(0.55, 1.45);
      tint[i] = rand(-0.13, 0.13);
    }
    germ = new Uint8Array(n);      // infection: armour layers left on the cell, 0 = none
    germHit = new Int32Array(n).fill(-1e9);   // tick the cell last lost a layer
    hurt = new Int32Array(n);      // creature cells look corrupted until this tick
    kind = null;
    germCells = [];
    germToGrow = 0;
    germWait = 40;
    germAge = 0;
    path = [];
    tickNo = 0;
    head = {
      x: cols * rand(0.3, 0.7), y: rows * rand(0.3, 0.7),
      a: rand(0, Math.PI * 2),
      k: 0, kGoal: 0, kTimer: 0,
      r: 6, rGoal: 6, rTimer: 0,
      lobe: rand(0, Math.PI * 2),
      v: STEP, mode: 'wander', timer: 0, style: 'ambush', strike: 15, weave: 0, side: 1, orbit: 18,
    };
  }

  function layout() {
    const w = stage.clientWidth - 32, h = stage.clientHeight - 24;
    px = Math.max(9, Math.min(13, Math.round(Math.min(w, h) / 78)));
    cols = Math.max(12, Math.floor(w / px));
    rows = Math.max(12, Math.floor(h / px));
    dpr = window.devicePixelRatio || 1;
    canvas.style.width = cols * px + 'px';
    canvas.style.height = rows * px + 'px';
    canvas.width = cols * px * dpr;
    canvas.height = rows * px * dpr;
    reset();
    draw();
  }

  function turnToward(angle, rate) {
    let d = angle - head.a;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    head.a += Math.max(-rate, Math.min(rate, d));
  }

  // Free space around a point: distance to the nearest wall or to the
  // trail (ignoring the stretch right behind the head).
  function clearance(x, y) {
    let c = Math.min(x, y, cols - x, rows - y) - head.r;
    for (let i = path.length - 1 - OWN_NECK; i >= 0; i -= 2) {
      const d = Math.hypot(path[i].x - x, path[i].y - y) - head.r - 1;
      if (d < c) c = d;
    }
    return c;
  }

  function probe(offset) {
    const a = head.a + offset;
    const cx = Math.cos(a), cy = Math.sin(a);
    return Math.min(
      clearance(head.x + cx * LOOK, head.y + cy * LOOK),
      clearance(head.x + cx * LOOK / 2, head.y + cy * LOOK / 2));
  }

  // Where the prey is: the middle of the patch, or the nearest scrap once
  // only a few cells are left. `near` is the distance to the closest cell.
  function findPrey() {
    if (!germCells.length) return null;
    let sx = 0, sy = 0, best = 0, near = Infinity;
    for (const i of germCells) {
      const x = i % cols + 0.5, y = Math.floor(i / cols) + 0.5;
      sx += x; sy += y;
      const d = Math.hypot(x - head.x, y - head.y);
      if (d < near) { near = d; best = i; }
    }
    const n = germCells.length;
    return n >= 8
      ? { x: sx / n, y: sy / n, near }
      : { x: best % cols + 0.5, y: Math.floor(best / cols) + 0.5, near };
  }

  const STYLES = ['ambush', 'bites', 'circle', 'engulf'];

  function enter(mode, ticks = 0) {
    const h = head;
    h.mode = mode;
    h.timer = ticks;
    if (mode === 'alert') {
      h.style = STYLES[Math.floor(Math.random() * STYLES.length)];
    } else if (mode === 'stalk') {
      // how close it creeps before striking
      h.strike = h.style === 'bites' ? rand(16, 22) : rand(13, 18);
      h.weave = rand(0, Math.PI * 2);
    } else if (mode === 'circle') {
      h.side = Math.random() < 0.5 ? 1 : -1;
      h.orbit = 18;
    }
  }

  function wanderSteer() {
    const h = head;
    const ahead = probe(0), left = probe(-0.8), right = probe(0.8);
    if (ahead < 3 || Math.min(left, right) < 1) {
      // something in the way: swing to whichever side is more open
      h.a += left > right ? -MAX_TURN : MAX_TURN;
      h.k = 0;
      h.kTimer = 0;
    } else {
      // curvature drifts toward a goal that changes now and then
      if (--h.kTimer <= 0) {
        h.kGoal = Math.random() < 0.2 ? rand(-MAX_TURN, MAX_TURN) : rand(-0.03, 0.03);
        h.kTimer = rand(30, 110);
      }
      h.k += (h.kGoal - h.k) * 0.06;
      h.a += h.k;
    }
  }

  // The head behaves like a predator rather than a homing missile. It
  // wanders unaware until the prey's scent reaches it, stops to look
  // (alert), then picks one of four ways to take it:
  //   ambush - stalk close, coil, one big lunge with the front wide open
  //   bites  - quick narrow strikes from further out, again and again
  //   circle - spiral around it, tightening the ring, then close over it
  //   engulf - ooze up slowly, settle on top and swell until it's gone
  // After a kill it sits and throbs for a moment (digest).
  function moveHead() {
    const h = head;
    const prey = findPrey();
    const dist = prey ? Math.hypot(prey.x - h.x, prey.y - h.y) : 0;
    const bearing = prey ? Math.atan2(prey.y - h.y, prey.x - h.x) : h.a;
    const bites = h.style === 'bites';
    let speed = STEP, swell = 0.09;

    if (!prey && h.mode !== 'wander' && h.mode !== 'lunge' && h.mode !== 'recover' && h.mode !== 'digest') {
      enter('digest', rand(45, 70));
    }

    if (target) {
      enter('wander');
      turnToward(Math.atan2(target.y - h.y, target.x - h.x), MAX_TURN);
    } else if (h.mode === 'wander') {
      // the scent spreads the longer the infection has been there
      if (prey && prey.near < 22 + germAge * 0.15) enter('alert', rand(25, 45));
      else wanderSteer();
    } else if (h.mode === 'alert') {
      turnToward(bearing, 0.05);
      speed = STEP * 0.12;
      h.rGoal = 4.5;
      if (--h.timer <= 0) {
        if (h.style === 'circle') enter('circle', 420);
        else if (h.style === 'engulf') enter('ooze', 400);
        else enter('stalk', 260);
      }
    } else if (h.mode === 'stalk') {
      turnToward(bearing + 0.7 * Math.sin(tickNo * 0.06 + h.weave), 0.08);
      speed = STEP * (bites ? 0.7 : 0.45);
      h.rGoal = 4 + 0.6 * Math.sin(tickNo * 0.15);
      const off = Math.abs(Math.atan2(Math.sin(bearing - h.a), Math.cos(bearing - h.a)));
      if ((dist < h.strike && off < 0.45) || dist < 7 || --h.timer <= 0) {
        enter('coil', bites ? rand(6, 12) : rand(18, 32));
      }
    } else if (h.mode === 'coil') {
      turnToward(bearing, 0.15);
      speed = STEP * 0.05;
      h.rGoal = 3;
      h.lobe += 0.25;
      if (--h.timer <= 0) enter('lunge', Math.ceil((dist + (bites ? 13 : 9)) / (STEP * (bites ? 3 : 2.6))));
    } else if (h.mode === 'lunge') {
      if (prey) turnToward(bearing, 0.025);
      speed = STEP * (bites ? 3 : 2.6);
      h.rGoal = bites ? 5 : 10.5;
      swell = 0.3;
      if (--h.timer <= 0) {
        if (!prey) enter('digest', rand(45, 70));
        else enter('recover', bites ? rand(12, 22) : rand(30, 55));
      }
    } else if (h.mode === 'circle') {
      // ride a ring around the prey and let the ring shrink
      h.orbit -= 0.09;
      const inward = Math.max(-0.6, Math.min(1.2, (dist - h.orbit) * 0.25));
      turnToward(bearing + h.side * (Math.PI / 2 - inward), 0.2);
      speed = STEP * 1.3;
      h.rGoal = 4.2;
      if (h.orbit < 4 || dist < 4 || --h.timer <= 0) enter('feed', 150);
    } else if (h.mode === 'ooze') {
      turnToward(bearing, 0.1);
      speed = STEP * 0.35;
      h.rGoal = 6 + 0.8 * Math.sin(tickNo * 0.1);
      if (dist < 5 || --h.timer <= 0) enter('feed', 150);
    } else if (h.mode === 'feed') {
      // sit on it and swell
      turnToward(bearing, 0.1);
      speed = dist > 3 ? STEP * 0.3 : STEP * 0.04;
      h.rGoal = 12.5;
      swell = 0.045;
      if (--h.timer <= 0) enter('recover', rand(20, 40));
    } else if (h.mode === 'recoil') {
      // thrown back off a fighter: flinch small, then come round again
      speed = -STEP * 0.4;
      h.rGoal = 3;
      swell = 0.3;
      h.lobe += 0.3;
      if (--h.timer <= 0) enter('recover', rand(15, 30));
    } else if (h.mode === 'digest') {
      speed = STEP * 0.08;
      h.rGoal = 7 + 2.5 * Math.sin(h.timer * 0.35);
      swell = 0.2;
      h.lobe += 0.08;
      if (--h.timer <= 0) enter('wander');
    } else {
      wanderSteer();
      speed = STEP * 0.5;
      if (--h.timer <= 0) prey ? enter('stalk', bites ? 90 : 200) : enter('wander');
    }

    h.v += (speed - h.v) * (h.mode === 'lunge' ? 0.4 : 0.12);

    // left to itself the head keeps swelling and shrinking; its outline slowly turns
    if ((h.mode === 'wander' || h.mode === 'recover') && --h.rTimer <= 0) {
      h.rGoal = rand(3.5, 10);
      h.rTimer = rand(14, 45);
    }
    h.r += (h.rGoal - h.r) * swell;
    h.lobe += 0.05;

    h.x += Math.cos(h.a) * h.v;
    h.y += Math.sin(h.a) * h.v;
    path.push({ x: h.x, y: h.y });
    if (path.length > TAIL) path.shift();
  }

  // The head is a lumpy disc. A cell under its centre gets a full life;
  // cells toward the rim get much less, so the trail thins out fast.
  function stampHead() {
    const h = head;
    const reach = h.r * 1.2 + 1;
    const x0 = Math.max(0, Math.floor(h.x - reach)), x1 = Math.min(cols - 1, Math.floor(h.x + reach));
    const y0 = Math.max(0, Math.floor(h.y - reach)), y1 = Math.min(rows - 1, Math.floor(h.y + reach));
    let ate = 0, blocked = 0;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * cols + x;
        const dx = x + 0.5 - h.x, dy = y + 0.5 - h.y;
        const rim = h.r * (1 + 0.16 * Math.sin(3 * Math.atan2(dy, dx) + h.lobe));
        const u = (Math.hypot(dx, dy) - edge[i]) / rim;
        if (u >= 1) continue;
        if (germ[i] && u < 0.85 && tickNo - germHit[i] > HIT_GAP) {
          // one layer per pass: armoured cells take several attacks
          germHit[i] = tickNo;
          if (--germ[i] === 0) ate++; else blocked++;
        }
        const inward = 1 - Math.max(u, 0);
        const v = TAIL * inward * inward * vigor[i] + 5;
        if (v > life[i]) {
          if (life[i] <= 0) num[i] = rollNumber();
          life[i] = born[i] = v;
        }
      }
    }
    if (ate) {
      // swallowing makes the head swell
      h.r = Math.min(13, h.r + 0.05 * ate);
      germCells = germCells.filter(i => germ[i]);
      if (!germCells.length) { germToGrow = 0; germWait = nextWait(); }
    }
    if (blocked >= 3 && germCells.length && kind.fury > 0 && h.mode !== 'recoil') {
      kind.fury--;
      fightBack();
    }
  }

  // Infections don't keep a schedule: sometimes one follows straight after
  // another, sometimes the grid stays clean for a long while.
  function nextWait() {
    const r = Math.random();
    if (r < 0.25) return rand(15, 70);
    if (r < 0.75) return rand(120, 340);
    return rand(420, 850);
  }

  // Four kinds. None of them can win, but they don't all go quietly.
  //   plain   - sits there
  //   runner  - backs away once it's being hunted, until it tires
  //   fighter - armoured, and hits back when bitten
  //   brute   - big and heavily armoured; some of them fight too
  function rollKind() {
    const r = Math.random();
    if (r < 0.36) return { name: 'plain', size: rand(30, 85), hp: 1, fury: 0 };
    if (r < 0.60) return { name: 'runner', size: rand(25, 55), hp: 1, fury: 0, runner: true, steps: 0, wait: 0 };
    if (r < 0.82) return { name: 'fighter', size: rand(45, 90), hp: 2, fury: 2 };
    return { name: 'brute', size: rand(110, 170), hp: 3, fury: Math.random() < 0.4 ? 3 : 0 };
  }

  // An infection appears somewhere away from the head and spreads cell by
  // cell until it reaches its full size or gets eaten.
  function spawnGerm() {
    let x, y, tries = 0;
    do {
      x = Math.floor(rand(8, cols - 8));
      y = Math.floor(rand(8, rows - 8));
    } while (Math.hypot(x - head.x, y - head.y) < 25 && ++tries < 30);
    const i = y * cols + x;
    kind = rollKind();
    germ[i] = kind.hp;
    germCells = [i];
    germToGrow = Math.floor(kind.size);
    germAge = 0;
  }

  function addGermCell(x, y, hp) {
    if (x < 1 || y < 1 || x >= cols - 1 || y >= rows - 1) return false;
    const i = y * cols + x;
    if (germ[i]) return false;
    germ[i] = hp;
    germHit[i] = -1e9;
    germCells.push(i);
    return true;
  }

  // slide the whole patch one cell; refuses if any of it would leave the grid
  function shiftGerm(dx, dy) {
    if (!dx && !dy) return false;
    for (const i of germCells) {
      const x = i % cols + dx, y = Math.floor(i / cols) + dy;
      if (x < 2 || y < 2 || x >= cols - 2 || y >= rows - 2) return false;
    }
    const moved = germCells.map(i => [i + dx + dy * cols, germ[i], germHit[i]]);
    for (const i of germCells) germ[i] = 0;
    for (const [i, hp, hit] of moved) { germ[i] = hp; germHit[i] = hit; }
    germCells = moved.map(m => m[0]);
    return true;
  }

  function flee() {
    const h = head;
    let cx = 0, cy = 0;
    for (const i of germCells) { cx += i % cols + 0.5; cy += Math.floor(i / cols) + 0.5; }
    cx /= germCells.length; cy /= germCells.length;
    const d = Math.hypot(cx - h.x, cy - h.y);
    const hunted = h.mode !== 'wander' && h.mode !== 'digest';
    if (d > (hunted ? 32 : 13)) return;
    if (--kind.wait > 0) return;
    // quick at first, then it runs out of breath
    kind.wait = kind.steps < 60 ? 3 : kind.steps < 110 ? 5 : 9;
    kind.steps++;
    const away = Math.atan2(cy - h.y, cx - h.x) + rand(-0.5, 0.5);
    const dx = Math.round(Math.cos(away)), dy = Math.round(Math.sin(away));
    shiftGerm(dx, dy) || shiftGerm(dx, 0) || shiftGerm(0, dy) || shiftGerm(-dy, dx) || shiftGerm(dy, -dx);
  }

  // The bite bounces off armour: the head is thrown back, part of its body
  // glitches, and the infection lashes a spike out at it.
  function fightBack() {
    const h = head;
    enter('recoil', rand(18, 28));
    h.v = -STEP * 1.6;

    const reach = Math.ceil(h.r) + 3;
    for (let y = Math.max(0, Math.floor(h.y) - reach); y <= Math.min(rows - 1, Math.floor(h.y) + reach); y++) {
      for (let x = Math.max(0, Math.floor(h.x) - reach); x <= Math.min(cols - 1, Math.floor(h.x) + reach); x++) {
        const i = y * cols + x;
        if (life[i] > 0 && Math.random() < 0.4) hurt[i] = tickNo + rand(20, 50);
      }
    }

    let from = germCells[0], near = Infinity;
    for (const i of germCells) {
      const d = Math.hypot(i % cols + 0.5 - h.x, Math.floor(i / cols) + 0.5 - h.y);
      if (d < near) { near = d; from = i; }
    }
    const fx = from % cols, fy = Math.floor(from / cols);
    const a = Math.atan2(h.y - fy, h.x - fx);
    for (let n = 1; n <= 7; n++) addGermCell(Math.round(fx + Math.cos(a) * n), Math.round(fy + Math.sin(a) * n), 1);
  }

  function updateGerm() {
    if (!germCells.length) {
      if (--germWait <= 0) spawnGerm();
      return;
    }
    germAge++;
    for (let n = 0; n < 3 && germToGrow > 0; n++) {
      const from = germCells[Math.floor(Math.random() * germCells.length)];
      const x = from % cols + [1, -1, 0, 0][Math.floor(Math.random() * 4)];
      const y = Math.floor(from / cols) + [0, 0, 1, -1][Math.floor(Math.random() * 4)];
      if (addGermCell(x, y, kind.hp)) germToGrow--;
    }
    if (kind.runner) flee();
  }

  // cheap repeatable noise, so the glitch holds still for a few ticks at a time
  function hash(a, b) {
    let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x7f4a7c15, 0xc2b2ae35);
    h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12;
    return h >>> 0;
  }

  // indexed by armour layers left: exposed cells are red and black,
  // armoured ones go almost solid black
  const GERM_FILL = [null,
    ['#0a0a0a', '#0a0a0a', '#0a0a0a', '#e3122b', '#e3122b', '#7a0613'],
    ['#0a0a0a', '#0a0a0a', '#0a0a0a', '#0a0a0a', '#7a0613', '#e3122b'],
    ['#0a0a0a', '#0a0a0a', '#0a0a0a', '#0a0a0a', '#0a0a0a', '#3a0309']];
  const GERM_INK = [null,
    ['#e3122b', '#e3122b', '#ffffff', '#0a0a0a', '#0a0a0a', '#ff5a6e'],
    ['#ffffff', '#e3122b', '#ff5a6e', '#ffffff', '#ffffff', '#0a0a0a'],
    ['#ffffff', '#ffffff', '#e3122b', '#ffffff', '#ff5a6e', '#ffffff']];
  const GERM_GLYPHS = '0123456789#X';

  function drawGerm() {
    if (!germCells.length) return;
    const slot = Math.floor(tickNo / 4);
    let x0 = cols, x1 = 0, y0 = rows, y1 = 0;
    for (const i of germCells) {
      const x = i % cols, y = Math.floor(i / cols);
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      ctx.fillStyle = GERM_FILL[germ[i]][hash(i, slot) % 6];
      ctx.fillRect(x * px, y * px, px, px);
    }
    // torn scanlines sticking out of the sides
    for (let g = 0; g < 3; g++) {
      const r = hash(g, slot);
      if (r % 5 < 2) continue;
      const y = y0 + (r >>> 3) % (y1 - y0 + 1);
      const len = 2 + (r >>> 9) % 4;
      const x = (r >>> 13) % 2 ? x1 + 1 - (r >>> 15) % 2 : x0 - len + (r >>> 15) % 2;
      ctx.fillStyle = (r >>> 17) % 3 ? '#e3122b' : '#0a0a0a';
      ctx.fillRect(x * px, y * px + px * 0.2, len * px, px * 0.6);
    }
  }

  function drawGermGlyphs() {
    const slot = Math.floor(tickNo / 4);
    for (const i of germCells) {
      const r = hash(i, slot);
      ctx.fillStyle = GERM_INK[germ[i]][r % 6];
      ctx.fillText(GERM_GLYPHS[(r >>> 8) % GERM_GLYPHS.length], (i % cols) * px + px / 2 + 0.5, Math.floor(i / cols) * px + px / 2 + 1);
    }
  }

  function tick() {
    tickNo++;
    for (let i = 0; i < life.length; i++) if (life[i] > 0) life[i]--;
    moveHead();
    stampHead();
    updateGerm();
  }

  function band(i) {
    const f = life[i] / born[i] + tint[i];
    let b = 0;
    while (b < BANDS.length && f < BANDS[b]) b++;
    return b;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cols * px, rows * px);

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        if (life[i] <= 0) continue;
        ctx.fillStyle = hurt[i] > tickNo ? GERM_FILL[1][hash(i, tickNo >> 2) % 6] : FILL[band(i)];
        ctx.fillRect(x * px, y * px, px, px);
      }
    }

    drawGerm();

    ctx.strokeStyle = '#1b2440';
    ctx.lineWidth = 0.5;
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    for (let x = 1; x < cols; x++) { ctx.moveTo(x * px + 0.5, 0); ctx.lineTo(x * px + 0.5, rows * px); }
    for (let y = 1; y < rows; y++) { ctx.moveTo(0, y * px + 0.5); ctx.lineTo(cols * px, y * px + 0.5); }
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.font = `600 ${Math.round(px * 0.72)}px "Lato", "Helvetica Neue", Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        if (life[i] <= 0 || germ[i]) continue;
        ctx.fillStyle = hurt[i] > tickNo ? GERM_INK[1][hash(i, tickNo >> 2) % 6] : INK[band(i)];
        ctx.fillText(num[i], x * px + px / 2 + 0.5, y * px + px / 2 + 1);
      }
    }
    drawGermGlyphs();
  }

  const speed = document.getElementById('speed');
  let prev = performance.now(), owed = 0;
  function frame(now) {
    const dt = Math.min(0.25, (now - prev) / 1000);
    prev = now;
    if (!paused) {
      owed += dt * speed.value;
      let ran = false;
      while (owed >= 1) { tick(); owed--; ran = true; }
      if (ran) draw();
    }
    requestAnimationFrame(frame);
  }

  const pauseBtn = document.getElementById('pause');
  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Play' : 'Pause';
  }
  function restart() { reset(); draw(); }

  pauseBtn.onclick = togglePause;
  document.getElementById('restart').onclick = restart;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    if (e.key === 'r' || e.key === 'R') restart();
  });

  function pointAt(e) {
    const b = canvas.getBoundingClientRect();
    target = { x: (e.clientX - b.left) / px, y: (e.clientY - b.top) / px };
  }
  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pointAt(e); });
  canvas.addEventListener('pointermove', e => { if (target) pointAt(e); });
  canvas.addEventListener('pointerup', () => { target = null; });
  canvas.addEventListener('pointercancel', () => { target = null; });

  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });

  window.snake = { get head() { return head; }, get germCells() { return germCells; }, get kind() { return kind; } };

  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
