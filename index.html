<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; }
  body { display: flex; flex-direction: column; font: 13px/1 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #9a9aa0; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px 16px 8px; }
  canvas { background: #fff; border-radius: 14px; touch-action: none; cursor: crosshair; }
  #bar { display: flex; gap: 14px; align-items: center; justify-content: center; padding: 6px 16px 14px; flex-wrap: wrap; }
  button { font: inherit; color: #ddd; background: #1c1c20; border: 1px solid #333; border-radius: 7px; padding: 7px 12px; cursor: pointer; }
  button:hover { background: #26262b; }
  label { display: flex; gap: 8px; align-items: center; }
  input[type=range] { width: 120px; accent-color: #2f6fe4; }
  .hint { opacity: .7; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar">
  <button id="pause">Pause</button>
  <button id="restart">Restart</button>
  <label>Speed <input id="speed" type="range" min="4" max="140" value="55"></label>
  <span class="hint">Hold the mouse down on the grid to steer · space = pause · R = restart</span>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  // Colour is how much of its life a cell has left: fresh cells are the
  // first colour, and they run through the rest as they fade out.
  const FILL = ['#2f6fe4', '#5cd0e0', '#9d8df5', '#a9f2d4', '#18245e'];
  const INK  = ['#06163f', '#06404a', '#221463', '#0d4a35', '#b9c6ff'];
  const BANDS = [0.72, 0.52, 0.34, 0.17];   // life fractions where the colour changes

  const STEP = 0.65;       // cells the head moves per tick
  const MAX_TURN = 0.065;  // radians per tick
  const LOOK = 15;         // how far ahead the head looks, in cells
  const OWN_NECK = 40;     // newest path points the head doesn't count as an obstacle
  const TAIL = 105;        // ticks a cell under the very centre of the head survives

  let cols, rows, px, dpr;
  let life, born, num, edge, vigor, tint;
  let germ, germCells, germToGrow, germWait;
  let path, tickNo, head, target = null;
  let paused = false;

  const rand = (a, b) => a + Math.random() * (b - a);

  // 1 + seven coin flips: 1..8, clustered around 4 and 5
  function rollNumber() {
    let n = 1;
    for (let i = 0; i < 7; i++) if (Math.random() < 0.5) n++;
    return n;
  }

  function reset() {
    const n = cols * rows;
    life = new Float32Array(n);    // ticks left
    born = new Float32Array(n);    // life it was last topped up to
    num = new Uint8Array(n);
    edge = new Float32Array(n);    // per-cell noise: ragged outline
    vigor = new Float32Array(n);   // per-cell noise: how long it lasts
    tint = new Float32Array(n);    // per-cell noise: when it changes colour
    for (let i = 0; i < n; i++) {
      edge[i] = rand(-0.9, 0.9);
      vigor[i] = rand(0.55, 1.45);
      tint[i] = rand(-0.13, 0.13);
    }
    germ = new Uint8Array(n);      // 1 where the infection is
    germCells = [];
    germToGrow = 0;
    germWait = 40;
    path = [];
    tickNo = 0;
    head = {
      x: cols * rand(0.3, 0.7), y: rows * rand(0.3, 0.7),
      a: rand(0, Math.PI * 2),
      k: 0, kGoal: 0, kTimer: 0,
      r: 6, rGoal: 6, rTimer: 0,
      lobe: rand(0, Math.PI * 2),
    };
  }

  function layout() {
    const w = stage.clientWidth - 32, h = stage.clientHeight - 24;
    px = Math.max(9, Math.min(13, Math.round(Math.min(w, h) / 78)));
    cols = Math.max(12, Math.floor(w / px));
    rows = Math.max(12, Math.floor(h / px));
    dpr = window.devicePixelRatio || 1;
    canvas.style.width = cols * px + 'px';
    canvas.style.height = rows * px + 'px';
    canvas.width = cols * px * dpr;
    canvas.height = rows * px * dpr;
    reset();
    draw();
  }

  function turnToward(angle, rate) {
    let d = angle - head.a;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    head.a += Math.max(-rate, Math.min(rate, d));
  }

  // Free space around a point: distance to the nearest wall or to the
  // trail (ignoring the stretch right behind the head).
  function clearance(x, y) {
    let c = Math.min(x, y, cols - x, rows - y) - head.r;
    for (let i = path.length - 1 - OWN_NECK; i >= 0; i -= 2) {
      const d = Math.hypot(path[i].x - x, path[i].y - y) - head.r - 1;
      if (d < c) c = d;
    }
    return c;
  }

  function probe(offset) {
    const a = head.a + offset;
    const cx = Math.cos(a), cy = Math.sin(a);
    return Math.min(
      clearance(head.x + cx * LOOK, head.y + cy * LOOK),
      clearance(head.x + cx * LOOK / 2, head.y + cy * LOOK / 2));
  }

  function moveHead() {
    const h = head;
    const ahead = probe(0), left = probe(-0.8), right = probe(0.8);

    // nearest infected cell, if there is one
    let prey = -1, preyDist = Infinity;
    for (const i of germCells) {
      const d = Math.hypot(i % cols + 0.5 - h.x, Math.floor(i / cols) + 0.5 - h.y);
      if (d < preyDist) { preyDist = d; prey = i; }
    }

    if (target) {
      turnToward(Math.atan2(target.y - h.y, target.x - h.x), MAX_TURN);
    } else if (prey >= 0) {
      // hunt: head straight for it, and open wide when close
      const px_ = prey % cols + 0.5, py_ = Math.floor(prey / cols) + 0.5;
      turnToward(Math.atan2(py_ - h.y, px_ - h.x), preyDist < 12 ? 0.22 : 0.12);
      if (preyDist < 18) { h.rGoal = Math.max(h.rGoal, 8.5); h.rTimer = 10; }
      h.k = 0;
    } else if (ahead < 3 || Math.min(left, right) < 1) {
      // something in the way: swing to whichever side is more open
      h.a += left > right ? -MAX_TURN : MAX_TURN;
      h.k = 0;
      h.kTimer = 0;
    } else {
      // wander: curvature drifts toward a goal that changes now and then
      if (--h.kTimer <= 0) {
        h.kGoal = Math.random() < 0.2 ? rand(-MAX_TURN, MAX_TURN) : rand(-0.03, 0.03);
        h.kTimer = rand(30, 110);
      }
      h.k += (h.kGoal - h.k) * 0.06;
      h.a += h.k;
    }

    // the head keeps swelling and shrinking, and its outline slowly turns
    if (--h.rTimer <= 0) { h.rGoal = rand(3.5, 10); h.rTimer = rand(14, 45); }
    h.r += (h.rGoal - h.r) * 0.09;
    h.lobe += 0.05;

    h.x += Math.cos(h.a) * STEP;
    h.y += Math.sin(h.a) * STEP;
    path.push({ x: h.x, y: h.y });
    if (path.length > TAIL) path.shift();
  }

  // The head is a lumpy disc. A cell under its centre gets a full life;
  // cells toward the rim get much less, so the trail thins out fast.
  function stampHead() {
    const h = head;
    const reach = h.r * 1.2 + 1;
    const x0 = Math.max(0, Math.floor(h.x - reach)), x1 = Math.min(cols - 1, Math.floor(h.x + reach));
    const y0 = Math.max(0, Math.floor(h.y - reach)), y1 = Math.min(rows - 1, Math.floor(h.y + reach));
    let ate = 0;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * cols + x;
        const dx = x + 0.5 - h.x, dy = y + 0.5 - h.y;
        const rim = h.r * (1 + 0.16 * Math.sin(3 * Math.atan2(dy, dx) + h.lobe));
        const u = (Math.hypot(dx, dy) - edge[i]) / rim;
        if (u >= 1) continue;
        if (germ[i] && u < 0.85) { germ[i] = 0; ate++; }
        const inward = 1 - Math.max(u, 0);
        const v = TAIL * inward * inward * vigor[i] + 5;
        if (v > life[i]) {
          if (life[i] <= 0) num[i] = rollNumber();
          life[i] = born[i] = v;
        }
      }
    }
    if (ate) {
      // swallowing makes the head swell
      h.r = Math.min(11, h.r + 0.05 * ate);
      germCells = germCells.filter(i => germ[i]);
      if (!germCells.length) { germToGrow = 0; germWait = rand(50, 140); }
    }
  }

  // An infection appears somewhere away from the head and spreads cell by
  // cell until it reaches its full size or gets eaten.
  function spawnGerm() {
    let x, y, tries = 0;
    do {
      x = Math.floor(rand(8, cols - 8));
      y = Math.floor(rand(8, rows - 8));
    } while (Math.hypot(x - head.x, y - head.y) < 25 && ++tries < 30);
    const i = y * cols + x;
    germ[i] = 1;
    germCells = [i];
    germToGrow = Math.floor(rand(30, 85));
  }

  function updateGerm() {
    if (!germCells.length) {
      if (--germWait <= 0) spawnGerm();
      return;
    }
    for (let n = 0; n < 2 && germToGrow > 0; n++) {
      const from = germCells[Math.floor(Math.random() * germCells.length)];
      const x = from % cols + [1, -1, 0, 0][Math.floor(Math.random() * 4)];
      const y = Math.floor(from / cols) + [0, 0, 1, -1][Math.floor(Math.random() * 4)];
      if (x < 1 || y < 1 || x >= cols - 1 || y >= rows - 1) continue;
      const to = y * cols + x;
      if (germ[to]) continue;
      germ[to] = 1;
      germCells.push(to);
      germToGrow--;
    }
  }

  // cheap repeatable noise, so the glitch holds still for a few ticks at a time
  function hash(a, b) {
    let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x7f4a7c15, 0xc2b2ae35);
    h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12;
    return h >>> 0;
  }

  const GERM_FILL = ['#0a0a0a', '#0a0a0a', '#0a0a0a', '#e3122b', '#e3122b', '#7a0613'];
  const GERM_INK  = ['#e3122b', '#e3122b', '#ffffff', '#0a0a0a', '#0a0a0a', '#ff5a6e'];
  const GERM_GLYPHS = '0123456789#X';

  function drawGerm() {
    if (!germCells.length) return;
    const slot = Math.floor(tickNo / 4);
    let x0 = cols, x1 = 0, y0 = rows, y1 = 0;
    for (const i of germCells) {
      const x = i % cols, y = Math.floor(i / cols);
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      ctx.fillStyle = GERM_FILL[hash(i, slot) % GERM_FILL.length];
      ctx.fillRect(x * px, y * px, px, px);
    }
    // torn scanlines sticking out of the sides
    for (let g = 0; g < 3; g++) {
      const r = hash(g, slot);
      if (r % 5 < 2) continue;
      const y = y0 + (r >>> 3) % (y1 - y0 + 1);
      const len = 2 + (r >>> 9) % 4;
      const x = (r >>> 13) % 2 ? x1 + 1 - (r >>> 15) % 2 : x0 - len + (r >>> 15) % 2;
      ctx.fillStyle = (r >>> 17) % 3 ? '#e3122b' : '#0a0a0a';
      ctx.fillRect(x * px, y * px + px * 0.2, len * px, px * 0.6);
    }
  }

  function drawGermGlyphs() {
    const slot = Math.floor(tickNo / 4);
    for (const i of germCells) {
      const r = hash(i, slot);
      ctx.fillStyle = GERM_INK[r % GERM_INK.length];
      ctx.fillText(GERM_GLYPHS[(r >>> 8) % GERM_GLYPHS.length], (i % cols) * px + px / 2 + 0.5, Math.floor(i / cols) * px + px / 2 + 1);
    }
  }

  function tick() {
    tickNo++;
    for (let i = 0; i < life.length; i++) if (life[i] > 0) life[i]--;
    moveHead();
    stampHead();
    updateGerm();
  }

  function band(i) {
    const f = life[i] / born[i] + tint[i];
    let b = 0;
    while (b < BANDS.length && f < BANDS[b]) b++;
    return b;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cols * px, rows * px);

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        if (life[i] <= 0) continue;
        ctx.fillStyle = FILL[band(i)];
        ctx.fillRect(x * px, y * px, px, px);
      }
    }

    drawGerm();

    ctx.strokeStyle = '#1b2440';
    ctx.lineWidth = 0.5;
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    for (let x = 1; x < cols; x++) { ctx.moveTo(x * px + 0.5, 0); ctx.lineTo(x * px + 0.5, rows * px); }
    for (let y = 1; y < rows; y++) { ctx.moveTo(0, y * px + 0.5); ctx.lineTo(cols * px, y * px + 0.5); }
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.font = `600 ${Math.round(px * 0.72)}px "Lato", "Helvetica Neue", Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        if (life[i] <= 0 || germ[i]) continue;
        ctx.fillStyle = INK[band(i)];
        ctx.fillText(num[i], x * px + px / 2 + 0.5, y * px + px / 2 + 1);
      }
    }
    drawGermGlyphs();
  }

  const speed = document.getElementById('speed');
  let prev = performance.now(), owed = 0;
  function frame(now) {
    const dt = Math.min(0.25, (now - prev) / 1000);
    prev = now;
    if (!paused) {
      owed += dt * speed.value;
      let ran = false;
      while (owed >= 1) { tick(); owed--; ran = true; }
      if (ran) draw();
    }
    requestAnimationFrame(frame);
  }

  const pauseBtn = document.getElementById('pause');
  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Play' : 'Pause';
  }
  function restart() { reset(); draw(); }

  pauseBtn.onclick = togglePause;
  document.getElementById('restart').onclick = restart;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    if (e.key === 'r' || e.key === 'R') restart();
  });

  function pointAt(e) {
    const b = canvas.getBoundingClientRect();
    target = { x: (e.clientX - b.left) / px, y: (e.clientY - b.top) / px };
  }
  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pointAt(e); });
  canvas.addEventListener('pointermove', e => { if (target) pointAt(e); });
  canvas.addEventListener('pointerup', () => { target = null; });
  canvas.addEventListener('pointercancel', () => { target = null; });

  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });

  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
