name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulation holds its rules (calm mode, the default)
        run: node bench.js --check
      - name: Simulation holds its rules (outbreak mode)
        run: node bench.js --check 80000 90 60 outbreak
